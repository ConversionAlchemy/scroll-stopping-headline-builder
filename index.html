<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A private, rule-based headline generator built from proven conversion-copy frameworks.">
  <title>Scroll-stopping headline builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin+Condensed:wght@700&family=PT+Sans:wght@400;700&family=PT+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="text-logo" href="#top">ConversionAlchemy.com</a>
  </header>

  <main id="top">
    <h1>Scroll-Stopping Headline Generator</h1>

    <form id="headlineForm">
      <section class="field-group" aria-labelledby="selling-heading">
        <div class="group-heading-row">
          <h2 id="selling-heading">
            What You Are Selling
          </h2>
          <p class="row-actions"><button class="text-link" id="resetAll" type="button">Reset</button> <span aria-hidden="true">•</span> <button class="text-link" id="loadExample" type="button">Load Example</button> <span aria-hidden="true">•</span> <button class="text-link" id="openPaste" type="button">Paste From AI</button></p>
        </div>
        <label class="field">
          <span class="field-label">Product Or Brand</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/Your%20product.jpg" alt="Product or brand" width="24" height="24"><input name="product" placeholder="DreamCloud Pillow..." required autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Ideal Customer</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/Ideal%20customer.jpg" alt="Ideal customer" width="24" height="24"><input name="audience" placeholder="side sleepers..." required autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Desired Outcome</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/Desired%20outcome.jpg" alt="Desired outcome" width="24" height="24"><input name="outcome" placeholder="wake up without neck pain..." required autocomplete="off"></span>
        </label>
      </section>

      <section class="field-group" aria-labelledby="obstacles-heading">
        <div class="group-heading-row">
          <h2 id="obstacles-heading">
            What Is In The Way <span>(optional)</span>
          </h2>
        </div>
        <label class="field">
          <span class="field-label">Main Pain Or Problem</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/Main%20problem%20.jpg" alt="Main pain or problem" width="24" height="24"><input name="pain" placeholder="waking up with a stiff neck..." autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Frustrating Alternative</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/frustrating%20alternative.jpg" alt="Frustrating alternative" width="24" height="24"><input name="alternative" placeholder="constantly flipping your pillow..." autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Top Objection Or Roadblock</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/roadblock.jpg" alt="Top objection or roadblock" width="24" height="24"><input name="roadblock" placeholder="buying another expensive pillow..." autocomplete="off"></span>
        </label>
      </section>

      <section class="field-group" aria-labelledby="proof-heading">
        <div class="group-heading-row">
          <h2 id="proof-heading">
            Why It Works <span>(optional)</span>
          </h2>
        </div>
        <label class="field">
          <span class="field-label">Unique Mechanism</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/unique%20mech.jpg" alt="Unique mechanism" width="24" height="24"><input name="mechanism" placeholder="adaptive dual-layer support..." autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Most Persuasive Feature</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/Most%20persuasive%20feature.jpg" alt="Most persuasive feature" width="24" height="24"><input name="feature" placeholder="adjustable loft..." autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Proof Or Credibility</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/trust.jpg" alt="Proof or credibility" width="24" height="24"><input name="proof" placeholder="trusted by 12,000+ sleepers..." autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Timeframe</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/time.jpg" alt="Timeframe" width="24" height="24"><input name="timeframe" placeholder="from the first night..." autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Simple Routine Or Use Moment</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/routine.jpeg" alt="Simple routine or use moment" width="24" height="24"><input name="routine" placeholder="your nightly wind-down..." autocomplete="off"></span>
        </label>
        <label class="field">
          <span class="field-label">Offer</span>
          <span class="input-wrap"><img src="https://conversionalchemy.b-cdn.net/App/Offer.jpg" alt="Offer" width="24" height="24"><input name="offer" placeholder="Try it for 60 nights, risk-free..." autocomplete="off"></span>
        </label>
      </section>

      <section class="field-group settings-group" aria-label="Output settings">
        <fieldset class="setting">
          <legend>Output</legend>
          <div class="checkbox-row">
            <label><input type="checkbox" name="includeHeadline" id="includeHeadline" checked> Headline</label>
            <label><input type="checkbox" name="includeSubhead" id="includeSubhead" checked> Subheadline</label>
          </div>
        </fieldset>
        <div class="setting" id="headlineCharsSetting">
          <div class="setting-label"><label for="maxChars">Maximum Headline Characters</label><strong id="maxCharsValue">60</strong></div>
          <div class="range-wrap">
            <span class="range-fill" aria-hidden="true"></span>
            <input class="range-control" id="maxChars" name="maxChars" type="range" min="20" max="120" step="5" value="60">
          </div>
          <div class="range-ends"><span>20</span><span>120</span></div>
        </div>
        <div class="setting" id="subheadCharsSetting">
          <div class="setting-label"><label for="maxSubChars">Maximum Subheadline Characters</label><strong id="maxSubCharsValue">140</strong></div>
          <div class="range-wrap">
            <span class="range-fill" aria-hidden="true"></span>
            <input class="range-control" id="maxSubChars" name="maxSubChars" type="range" min="40" max="220" step="10" value="140">
          </div>
          <div class="range-ends"><span>40</span><span>220</span></div>
        </div>
      </section>

      <button class="primary-button" id="generateButton" type="submit"><img src="https://conversionalchemy.b-cdn.net/App/Dice.png" alt="" width="20" height="20"><span class="button-label">Generate</span></button>
    </form>

    <section class="results-section" id="resultsSection" hidden>
      <div class="results-heading">
        <h2>Results <strong id="resultsCount">(0)</strong></h2>
        <button class="text-link" id="saveAll" type="button">Save As PDF</button>
      </div>
      <div class="results-box">
        <div id="results" aria-live="polite"></div>
        <p class="caret" id="caret" aria-hidden="true" hidden>&#9613;</p>
        <div class="empty-state" id="emptyState" hidden>
          <p>No formulas can be completed from these inputs. Add a mechanism, proof point, pain or offer.</p>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <button class="text-link" id="resetFooter" type="button">Reset</button>
  </footer>

  <dialog id="pasteDialog" aria-label="Form code">
    <textarea id="pasteInput" rows="14" aria-label="Form code" spellcheck="false"></textarea>
    <p class="paste-error" id="pasteError" hidden></p>
    <div class="dialog-actions">
      <button class="secondary-button" id="copyPrompt" type="button">Copy Instructions For AI</button>
      <button class="secondary-button" id="closePaste" type="button">Cancel</button>
      <button class="primary-button" id="applyPaste" type="button">Fill Form</button>
    </div>
  </dialog>

  <div class="status-message" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
